<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar aula - PKZ · One to One</title>
    <!-- index.css tem o estilo base (header, footer, botão); agendamento.css só o formulário -->
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/agendamento.css">
</head>
<body>
  <!-- Cabeçalho: preenchido pelo app.js -->
  <header></header>

  <main>

    <!-- Cartão com o formulário de agendamento -->
    <section class="agendamento">
      <p class="eyebrow">AGENDAMENTO</p>

      <h1>Agende sua aula</h1>

      <p>Escolha a unidade, o dia e o horário. A gente confirma pelo e-mail informado.</p>

      <form id="form-agendamento" action="#" method="post">
        <!-- label + input ligados pelo for/id -->
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>

        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>

        <label for="unidade">Unidade</label>
        <select id="unidade" name="unidade" required>
          <option value="">Selecione</option>
          <option value="PKZ">PKZ</option>
          <option value="One to One">One to One</option>
        </select>

        <!-- Data e horário lado a lado -->
        <div class="linha">
          <div>
            <label for="data">Data</label>
            <!-- o min (data mínima = hoje) é preenchido pelo app.js -->
            <input type="date" id="data" name="data" required>
          </div>

          <div>
            <label for="horario">Horário</label>
            <select id="horario" name="horario" required>
              <option value="">Selecione</option>
              <option value="07:00">07:00</option>
              <option value="09:00">09:00</option>
              <option value="12:00">12:00</option>
              <option value="17:00">17:00</option>
              <option value="19:00">19:00</option>
            </select>
          </div>
        </div>

        <label for="observacoes">Observações (opcional)</label>
        <textarea id="observacoes" name="observacoes" rows="3"></textarea>

        <!-- Mensagem: fica vazia e o app.js preenche ao enviar -->
        <p id="mensagem"></p>

        <button type="submit" class="botao">Agendar</button>
      </form>
    </section>
  </main>

  <!-- Rodapé: preenchido pelo app.js -->
  <footer></footer>

  <script src="../js/app.js"></script>
</body>
</html>
